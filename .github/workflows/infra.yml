name: Infrastructure — Terraform CI

permissions:
  id-token: write
  contents: read

on:
  push:
    branches: [ main ]
    paths: [ 'infra/**' ]
  pull_request:
    paths: [ 'infra/**' ]
  workflow_dispatch:

jobs:
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Configure AWS credentials (OIDC)
        if: ${{ env.AWS_ROLE_TO_ASSUME }}
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ap-south-1
          role-session-name: github-actions

      - name: Configure AWS credentials (fallback)
        if: ${{ env.AWS_ACCESS_KEY_ID }}
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Verify AWS credentials
        run: |
          if ! aws sts get-caller-identity --output text >/dev/null 2>&1; then
            echo "ERROR: AWS credentials not configured or invalid. Set 'AWS_ROLE_TO_ASSUME' (preferred) or 'AWS_ACCESS_KEY_ID'/'AWS_SECRET_ACCESS_KEY' in repository secrets." >&2
            exit 1
          fi

      - name: Terraform init
        run: terraform -chdir=infra init -input=false

      - name: Terraform plan
        run: terraform -chdir=infra plan -out=tfplan -input=false

      - name: Terraform apply (main pushes)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform -chdir=infra apply -auto-approve tfplan
