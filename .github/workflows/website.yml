name: Website - Deploy

permissions:
  id-token: write
  contents: read

on:
  push:
    branches: [ main ]
    paths: [ 'website/**' ]
  workflow_dispatch:

jobs:
  deploy:
    name: Sync site and invalidate CDN
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ap-south-1
          role-session-name: github-actions

      - name: Verify AWS credentials
        run: aws sts get-caller-identity

      - name: Terraform init (for outputs)
        run: terraform -chdir=infra init -input=false

      - name: Sync website to S3
        run: |
          BUCKET=$(terraform -chdir=infra output -raw s3_bucket_name)
          aws s3 sync website/ s3://"$BUCKET" --delete

      - name: Invalidate CloudFront cache
        run: |
          DIST_ID=$(terraform -chdir=infra output -raw cloudfront_distribution_id)
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*" || true
