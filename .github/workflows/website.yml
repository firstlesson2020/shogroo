name: Website - Deploy

permissions:
  id-token: write
  contents: read

on:
  push:
    branches: [ main ]
    paths: [ 'website/**' ]
  workflow_dispatch:

jobs:
  deploy:
    name: Sync site and invalidate CDN
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Configure AWS credentials (OIDC)
        if: env.AWS_ROLE_TO_ASSUME != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ap-south-1
          role-session-name: github-actions

      - name: Configure AWS credentials (fallback)
        if: env.AWS_ROLE_TO_ASSUME == '' && env.AWS_ACCESS_KEY_ID != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Verify AWS credentials
        run: |
          if ! aws sts get-caller-identity --output text >/dev/null 2>&1; then
            echo "ERROR: AWS credentials not configured or invalid." >&2
            echo "Set AWS_ROLE_TO_ASSUME (preferred) or access keys in the production environment secrets." >&2
            exit 1
          fi
          aws sts get-caller-identity

      - name: Terraform init (for outputs)
        run: terraform -chdir=infra init -input=false

      - name: Sync website to S3
        run: |
          BUCKET=$(terraform -chdir=infra output -raw s3_bucket_name)
          aws s3 sync website/ s3://"$BUCKET" --delete

      - name: Invalidate CloudFront cache
        run: |
          DIST_ID=$(terraform -chdir=infra output -raw cloudfront_distribution_id)
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*" || true
