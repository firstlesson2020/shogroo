<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>shogroo.com</title>
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <h1 class="site-title">Welcome to Shogroo</h1>
      </div>
      <div class="header-confetti" aria-hidden="true"></div>
    </header>

    <main class="hero">
      <div class="hero-bg" aria-hidden="true">
        <!-- Inline image for small screens to preserve full image without cropping -->
        <img class="hero-img" src="/shogroo-comingsoon.png" alt="" aria-hidden="true">
      </div>

      <div id="flowers" aria-hidden="true"></div>
      <div id="confetti" aria-hidden="true"></div>
    </main>



    <script>
      // Celebration flow: confetti + sparkles + applause sound for 10s on every load
      (function(){
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        try {
          const duration = 10000; // 10s
          const intervalMs = 800;

          // repeated confetti bursts
          const int = setInterval(()=>{
            if(window.createConfetti) window.createConfetti(document.querySelector('.header-confetti') || document.getElementById('confetti'));
          }, intervalMs);
          setTimeout(()=>{ clearInterval(int); }, duration);

          // header bloom icon
          const header = document.querySelector('.site-header');
          if(header){
            const bloom = document.createElement('div');
            bloom.className = 'header-bloom';
            bloom.setAttribute('aria-hidden','true');
            header.appendChild(bloom);
            setTimeout(()=>{ bloom.remove(); }, duration);
          }

          // applause sound (attempt autoplay). This may be blocked by some browsers.
          const audio = document.createElement('audio');
          audio.id = 'applause-audio';
          audio.src = '/audio/applause.mp3';
          audio.preload = 'auto';
          audio.volume = 0.9;
          audio.loop = false;
          audio.autoplay = false; // we'll start via JS
          document.body.appendChild(audio);
          const tryPlay = ()=>{
            const p = audio.play();
            if (p && p.then) { p.catch(()=>{}); }
          };
          // attempt to resume AudioContext if present
          try {
            if (window.AudioContext || window.webkitAudioContext) {
              const C = window.AudioContext || window.webkitAudioContext;
              const ctx = new C();
              if (ctx.state === 'suspended' && ctx.resume) ctx.resume().catch(()=>{});
            }
          } catch(e){}
          tryPlay();
          // stop sound after duration
          setTimeout(()=>{ try{ audio.pause(); audio.currentTime = 0; audio.remove(); }catch(e){} }, duration + 200);

          // no explicit permission UI — attempt autoplay only

        } catch(e) {
          // ignore
        }
      })();

      // Confetti generator function (callable)
      window.createConfetti = function(root){
        try {
          if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
          const colors = ['#ff5e7a','#ffb86b','#ffd76b','#8be6a7','#7cc7ff','#c792ea'];
          const pieces = 40;
          const rect = (root && root.getBoundingClientRect && root.getBoundingClientRect()) || {left: window.innerWidth/2, top: window.innerHeight/3, width: 0, height:0};
          const centerX = rect.left + rect.width/2;
          const centerY = rect.top + rect.height/2;

          for(let i=0;i<pieces;i++){
            const el = document.createElement('div');
            el.className = 'confetti';
            el.style.background = colors[Math.floor(Math.random()*colors.length)];
            const angle = (Math.random()*Math.PI*2);
            const dist = 60 + Math.random()*220;
            const tx = Math.cos(angle)*dist + (Math.random()*80-40);
            const ty = -Math.abs(Math.sin(angle))* (120 + Math.random()*300);
            el.style.left = (centerX + (Math.random()*80-40)) + 'px';
            el.style.top = (centerY + (Math.random()*40-20)) + 'px';
            el.style.setProperty('--tx', tx+'px');
            el.style.setProperty('--ty', ty+'px');
            el.style.transform = 'translate(0,0)';
            el.style.opacity = '1';
            el.style.animation = 'confetti-burst ' + (900 + Math.floor(Math.random()*900)) + 'ms cubic-bezier(.2,.8,.2,1) forwards';
            el.style.zIndex = 10;
            document.body.appendChild(el);
          }
          setTimeout(()=>{ document.querySelectorAll('.confetti').forEach(n=>n.remove()); }, 2200);
        } catch(e) {}
      };

      // Flowers flow from bottom: spawn flowers for `duration` ms on every load
      (function(){
        if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
        try {
          const container = document.getElementById('flowers');
          if (!container) return;
          const duration = 10000; // ms
          const interval = 250; // spawn every 250ms
          const stopAt = Date.now() + duration;

          function spawnOne(){
            const span = document.createElement('span');
            span.className = 'flower';
            span.textContent = '🌸';
            const size = 18 + Math.random()*40;
            span.style.fontSize = size + 'px';
            span.style.left = (8 + Math.random()*84) + '%';
            const animDur = 6 + Math.random()*6; // seconds
            span.style.animationDuration = animDur + 's';
            span.style.animationDelay = '0s';
            span.style.opacity = (0.6 + Math.random()*0.4).toFixed(2);
            container.appendChild(span);
            // remove after animation finished
            setTimeout(()=>{ try{ span.remove(); }catch(e){} }, (animDur*1000) + 800);
          }

          // immediate small burst
          for(let i=0;i<6;i++) spawnOne();
          const id = setInterval(()=>{
            if (Date.now() > stopAt){ clearInterval(id); return; }
            spawnOne();
          }, interval);
        } catch(e){}
      })();
    </script>
    <style>
      :root{--accent:#7c4dff;--muted:#6b7280}
      body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;background:linear-gradient(180deg,#f8fafc 0%, #ffffff 60%);color:#0f172a}
      .hero{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:48px}
      .site-header{position:relative;display:flex;align-items:center;justify-content:center;padding:22px 20px;background:transparent}
      .header-inner{max-width:1200px;width:100%;display:flex;justify-content:center}
      .site-title{font-size:20px;color:#0b1220;margin:0;padding:8px 14px;border-radius:10px;background:linear-gradient(180deg,rgba(255,255,255,0.9),rgba(250,250,250,0.85));box-shadow:0 6px 20px rgba(12,16,24,0.06)}
      .header-confetti{position:fixed;top:0;left:0;right:0;height:140px;pointer-events:none;z-index:9}
      .header-bloom{position:absolute;right:20px;top:50%;transform:translateY(-50%);width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fff6e6,#ffd76b);box-shadow:0 12px 30px rgba(255,180,80,0.18);display:flex;align-items:center;justify-content:center;font-weight:700;color:#3b2b00;z-index:12;animation:bloom 550ms cubic-bezier(.2,.8,.2,1) forwards}
      @keyframes bloom{0%{transform:translateY(-50%) scale(0.2);opacity:0}50%{transform:translateY(-50%) scale(1.12);opacity:1}100%{transform:translateY(-50%) scale(1);opacity:1}}
      .hero-bg{position:absolute;inset:0;background-image:url('/shogroo-comingsoon.png');background-size:cover;background-position:center center;background-repeat:no-repeat;background-attachment:scroll;filter:contrast(1.02) saturate(1.05);z-index:0}
      .hero-img{display:none;width:100%;height:auto;object-fit:contain}
      .hero-content{max-width:980px;text-align:center;position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%}
      .title{font-size:clamp(28px,6vw,56px);margin:0 0 12px;letter-spacing:-0.02em;color:#ffffff;text-shadow:0 12px 30px rgba(2,6,23,0.6)}
      .subtitle{margin:0 0 20px;color:rgba(255,255,255,0.95);font-size:18px;text-shadow:0 8px 18px rgba(2,6,23,0.45)}

      /* Flowers container */
      #flowers{position:absolute;left:0;right:0;bottom:0;top:0;pointer-events:none;z-index:1}
      /* Badge holder */
      #badge-holder{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:2}
      /* Confetti burst (one-shot on load) */
      #confetti{position:fixed;inset:0;pointer-events:none;z-index:4;overflow:visible}
      .confetti{position:absolute;width:10px;height:14px;border-radius:2px;will-change:transform,opacity;}
      .cele-star{position:absolute;width:8px;height:8px;border-radius:50%;background:radial-gradient(#fff,#ffd76b);box-shadow:0 6px 18px rgba(255,183,98,0.12);animation:star-float 1400ms ease-in-out infinite}
      @keyframes star-float{0%{transform:translateY(0) scale(0.9);opacity:0}10%{opacity:1}50%{transform:translateY(-36px) scale(1)}100%{transform:translateY(0) scale(0.9);opacity:0}}
      @keyframes confetti-burst {
        0%{transform:translate(0,0) rotate(0);opacity:1}
        100%{transform:translate(var(--tx),var(--ty)) rotate(540deg);opacity:0}
      }
      .flower{position:absolute;bottom:-40px;will-change:transform,opacity;display:inline-block;text-shadow:0 4px 14px rgba(12,16,24,0.08)}
      @keyframes rise {
        0%{transform:translateY(0) rotate(0deg);opacity:0}
        10%{opacity:1}
        100%{transform:translateY(-120vh) rotate(360deg);opacity:0}
      }
      .flower{animation-name:rise;animation-timing-function:cubic-bezier(.2,.9,.2,1);}

      /* Add subtle entrance for hero */
      .hero-content{transform:translateY(8px);opacity:0;animation:enter 650ms ease-out 120ms forwards;z-index:3}
      @keyframes enter{to{transform:none;opacity:1}}

      @media (prefers-reduced-motion: reduce){
        .flower{animation:none}
        .hero-content{animation:none}
      }

      /* Responsive adjustments */
      @media (max-width: 900px){
        .hero{padding:32px}
        .site-title{font-size:18px}
      }
      @media (max-width: 640px){
        .hero{padding:20px;min-height:70vh}
        /* show the full image on small screens without cropping */
        .hero-bg{background-position:top center;background-size:contain;background-repeat:no-repeat}
        /* use inline image on very small screens to keep aspect ratio */
        .hero-img{display:block}
        .site-title{font-size:15px;padding:6px 10px}
        .subtitle{font-size:15px}
        .header-bloom{right:10px;width:44px;height:44px}
      }

      /* Badge styling (removed UI but keep in case) */
      .badge{width:220px;height:120px;border-radius:18px;display:flex;align-items:center;justify-content:center;position:relative;background:linear-gradient(180deg,#fff,#fffbf5);box-shadow:0 20px 50px rgba(2,6,23,0.12);transform:translateY(-20px) scale(0.9);opacity:0}
      .badge.reveal{transform:translateY(0) scale(1);opacity:1;transition:transform 420ms cubic-bezier(.2,.8,.2,1),opacity 320ms}
      .badge .medal{width:140px;height:80px;border-radius:40px;background:linear-gradient(180deg,#ffd76b,#ffb86b);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(12,16,24,0.12)}
      .badge .medal-inner{font-weight:700;letter-spacing:1px;color:#3b2b00}
      .badge .ribbon{position:absolute;width:36px;height:60px;top:10px;background:linear-gradient(180deg,#ff7b89,#ff4b6a);border-radius:6px}
      .badge .ribbon.left{left:12px;transform:rotate(-18deg)}
      .badge .ribbon.right{right:12px;transform:rotate(18deg)}
      .badge .scissors{position:absolute;right:10px;top:10px;font-size:20px;opacity:0.95}
      /* Audio permission overlay */
      .audio-permission{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:40;pointer-events:auto}
      .audio-card{background:rgba(255,255,255,0.98);padding:18px 22px;border-radius:12px;box-shadow:0 18px 50px rgba(2,6,23,0.12);text-align:center}
      .audio-card p{margin:0 0 12px;font-weight:600}
      .audio-card button{padding:8px 14px;border-radius:8px;border:none;background:#7c4dff;color:#fff;cursor:pointer}
    </style>
  </body>
</html>
