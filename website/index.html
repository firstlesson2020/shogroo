<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>shogroo.com</title>
  </head>
  <body>
    <main class="hero">
      <div class="hero-content">
        <h1 class="title">Welcome to Shogroo</h1>
        <p class="subtitle">Beautifully simple storefronts — crafted with care.</p>
        <img class="logo" src="/shogroo-comingsoon.png" alt="Shogroo logo">
      </div>

      <div id="flowers" aria-hidden="true"></div>
    </main>

    <script>
      // Create floating flowers on load
      (function() {
        const container = document.getElementById('flowers');
        const count = 18;

        for (let i = 0; i < count; i++) {
          const span = document.createElement('span');
          span.className = 'flower';
          span.textContent = '🌸';

          const size = 16 + Math.random() * 36; // px
          span.style.fontSize = size + 'px';
          span.style.left = (5 + Math.random() * 90) + '%';
          span.style.animationDuration = (6 + Math.random() * 6) + 's';
          span.style.animationDelay = (Math.random() * 3) + 's';
          span.style.opacity = (0.6 + Math.random() * 0.4).toFixed(2);

          container.appendChild(span);
        }
      })();
    </script>
    <style>
      :root{--accent:#7c4dff;--muted:#6b7280}
      body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial;background:linear-gradient(180deg,#f8fafc 0%, #ffffff 60%);color:#0f172a}
      .hero{min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:48px}
      .hero-content{max-width:980px;text-align:center}
      .title{font-size:clamp(28px,6vw,56px);margin:0 0 12px;letter-spacing:-0.02em;color:#0b1220}
      .subtitle{margin:0 0 20px;color:var(--muted);font-size:18px}
      .logo{width:260px;max-width:60%;height:auto;border-radius:12px;box-shadow:0 12px 40px rgba(15,23,42,0.08)}

      /* Flowers container */
      #flowers{position:absolute;left:0;right:0;bottom:0;top:0;pointer-events:none}
      .flower{position:absolute;bottom:-40px;will-change:transform,opacity;display:inline-block;text-shadow:0 4px 14px rgba(12,16,24,0.08)}
      @keyframes rise {
        0%{transform:translateY(0) rotate(0deg);opacity:0}
        10%{opacity:1}
        100%{transform:translateY(-120vh) rotate(360deg);opacity:0}
      }
      .flower{animation-name:rise;animation-timing-function:cubic-bezier(.2,.9,.2,1);}

      /* Add subtle entrance for hero */
      .hero-content{transform:translateY(8px);opacity:0;animation:enter 650ms ease-out 120ms forwards}
      @keyframes enter{to{transform:none;opacity:1}}

      @media (prefers-reduced-motion: reduce){
        .flower{animation:none}
        .hero-content{animation:none}
      }
    </style>
  </body>
</html>
